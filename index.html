<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS Event Playground</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>JS Event Assignment</h1>

  <button id="magicBtn">Click me!</button>
  <p id="hoverMe">Hover over me!</p>

  <input type="text" id="keyInput" placeholder="Type something...">
  
  <div class="gallery">
    <img src="image1.jpeg" class="slide" alt="Gallery Image" width="150" height="150">
  </div>

  <div class="tabs">
    <button class="tab" data-tab="1">Tab 1</button>
    <button class="tab" data-tab="2">Tab 2</button>
    <div class="tab-content" id="tab-1">Content for Tab 1</div>
    <div class="tab-content" id="tab-2">Content for Tab 2</div>
  </div>

  <form id="myForm">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button type="submit">Submit</button>
    <div id="feedback"></div>
  </form>

  <script src="script.js"></script>
</body>
</html>
